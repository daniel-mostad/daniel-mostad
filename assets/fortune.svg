<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 181" width="880" height="181" role="img" aria-label="fortune: Debugging is twice as hard as writing the code in the first place. Therefore, if you write the code as cleverly as possible, you are, by definition, not smart enough to debug it. — Brian Kernighan">
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .reveal { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="878" height="179" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="38" y="42" font-size="15"><tspan fill="#39d353">~/github</tspan><tspan fill="#484f58">&#160;$&#160;</tspan><tspan fill="#e6edf2">fortune</tspan></text>
  <g class="reveal" style="animation-delay:0.25s"><text x="38" y="76" font-size="15" font-style="italic" fill="#e6edf2"><tspan fill="#39d353">“</tspan>Debugging is twice as hard as writing the code in the first place.</text></g>
  <g class="reveal" style="animation-delay:0.40s"><text x="38" y="103" font-size="15" font-style="italic" fill="#e6edf2">Therefore, if you write the code as cleverly as possible, you are, by</text></g>
  <g class="reveal" style="animation-delay:0.55s"><text x="38" y="130" font-size="15" font-style="italic" fill="#e6edf2">definition, not smart enough to debug it.<tspan fill="#39d353">”</tspan></text></g>
  <g class="reveal" style="animation-delay:0.70s"><text x="56" y="157" font-size="14" fill="#8b949e">— Brian Kernighan</text></g>
</svg>
