<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 181" width="880" height="181" role="img" aria-label="fortune: There are two ways of constructing a software design: one way is to make it so simple that there are obviously no deficiencies, and the other way is to make it so complicated that there are no obvious deficiencies. — C. A. R. Hoare">
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .reveal { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="878" height="179" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="38" y="42" font-size="15"><tspan fill="#39d353">~/github</tspan><tspan fill="#484f58">&#160;$&#160;</tspan><tspan fill="#e6edf2">fortune</tspan></text>
  <g class="reveal" style="animation-delay:0.25s"><text x="38" y="76" font-size="15" font-style="italic" fill="#e6edf2"><tspan fill="#39d353">“</tspan>There are two ways of constructing a software design: one way is to make it</text></g>
  <g class="reveal" style="animation-delay:0.40s"><text x="38" y="103" font-size="15" font-style="italic" fill="#e6edf2">so simple that there are obviously no deficiencies, and the other way is to</text></g>
  <g class="reveal" style="animation-delay:0.55s"><text x="38" y="130" font-size="15" font-style="italic" fill="#e6edf2">make it so complicated that there are no obvious deficiencies.<tspan fill="#39d353">”</tspan></text></g>
  <g class="reveal" style="animation-delay:0.70s"><text x="56" y="157" font-size="14" fill="#8b949e">— C. A. R. Hoare</text></g>
</svg>
