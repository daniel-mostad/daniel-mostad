<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 52" width="880" height="52" role="img" aria-label="~/github $ cat ~/.contact">
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .reveal { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; }
      .cur { animation: none; }
    }
  </style>
  <rect x="1" y="1" width="878" height="50" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="38" y="33" font-size="15"><tspan fill="#39d353">~/github</tspan><tspan fill="#484f58">&#160;$&#160;</tspan><tspan fill="#e6edf2">cat ~/.contact</tspan></text>
  <rect class="cur" x="269" y="20" width="8" height="16" fill="#39d353"/>
</svg>
