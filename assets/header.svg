<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="daniel@zingico:~$ ./whoami --human — DANIEL OLOV MOSTAD, fullstack developer">
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .g   { fill: #4ade80; }
    .dim { fill: #7d7d7d; }
    .fnt { fill: #525252; }
    .w   { fill: #f5f5f5; }
    .t     { opacity: 0; animation: keyIn .01s steps(1) forwards; }
    .reveal{ opacity: 0; animation: fadeUp .7s ease forwards; }
    .cur   { animation: blink 1.1s steps(1) infinite; }
    @keyframes keyIn  { to { opacity: 1; } }
    @keyframes fadeUp { to { opacity: 1; } }
    @keyframes blink  { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t, .reveal { animation: none; opacity: 1; }
      .cur { animation: none; }
    }
  </style>

  <!-- frame -->
  <rect x="1" y="1" width="878" height="248" rx="12" fill="#0a0a0a" stroke="#262626"/>

  <!-- CRT scanlines -->
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect y="3" width="4" height="1" fill="#ffffff" opacity="0.03"/>
  </pattern>
  <rect x="1" y="1" width="878" height="248" rx="12" fill="url(#scan)"/>

  <!-- status corner -->
  <text x="844" y="36" text-anchor="end" font-size="11" class="fnt">HTTP/2 200 · guest tty</text>

  <!-- prompt + typed command -->
  <text x="36" y="72" font-size="15">
    <tspan class="g">daniel@zingico</tspan><tspan class="fnt">:~$</tspan><tspan class="w">&#160;</tspan><tspan class="w t" style="animation-delay:.40s">.</tspan><tspan class="w t" style="animation-delay:.47s">/</tspan><tspan class="w t" style="animation-delay:.54s">w</tspan><tspan class="w t" style="animation-delay:.61s">h</tspan><tspan class="w t" style="animation-delay:.68s">o</tspan><tspan class="w t" style="animation-delay:.75s">a</tspan><tspan class="w t" style="animation-delay:.82s">m</tspan><tspan class="w t" style="animation-delay:.89s">i</tspan><tspan class="w t" style="animation-delay:.96s">&#160;</tspan><tspan class="w t" style="animation-delay:1.03s">-</tspan><tspan class="w t" style="animation-delay:1.10s">-</tspan><tspan class="w t" style="animation-delay:1.17s">h</tspan><tspan class="w t" style="animation-delay:1.24s">u</tspan><tspan class="w t" style="animation-delay:1.31s">m</tspan><tspan class="w t" style="animation-delay:1.38s">a</tspan><tspan class="w t" style="animation-delay:1.45s">n</tspan>
  </text>

  <!-- name, with faint CRT chromatic ghosts -->
  <g class="reveal" style="animation-delay:1.8s">
    <text x="34" y="136" font-size="36" font-weight="700" fill="#4ade80" opacity="0.16">DANIEL OLOV MOSTAD</text>
    <text x="38" y="136" font-size="36" font-weight="700" fill="#f87171" opacity="0.12">DANIEL OLOV MOSTAD</text>
    <text x="36" y="136" font-size="36" font-weight="700" class="w" letter-spacing="1">DANIEL OLOV MOSTAD</text>
  </g>

  <g class="reveal" style="animation-delay:2.2s">
    <text x="36" y="168" font-size="15" class="dim">fullstack developer · apprentice @ Visma · builds <tspan class="g">zingico.com</tspan></text>
  </g>

  <g class="reveal" style="animation-delay:2.6s">
    <text x="36" y="198" font-size="14" font-style="italic" fill="#34d399" opacity="0.8">// I create because I have to</text>
  </g>

  <!-- fresh prompt with blinking cursor -->
  <g class="reveal" style="animation-delay:3.0s">
    <text x="36" y="230" font-size="15"><tspan class="g">daniel@zingico</tspan><tspan class="fnt">:~$</tspan></text>
    <rect x="196" y="217" width="9" height="16" fill="#4ade80" class="cur"/>
  </g>
</svg>
