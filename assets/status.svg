  <g class="reveal" style="animation-delay:1.05s"><text x="66" y="182" font-size="15" fill="#f85149">modified:</text><text x="180" y="182" font-size="15" fill="#f85149">craft</text><text x="318" y="182" font-size="15" fill="#484f58">→ <tspan fill="#8b949e">going deeper on rust, design, and systems that last</tspan></text></g>

