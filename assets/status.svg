<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 219" width="880" height="219" role="img" aria-label="~/github $ git status — working on zingico.com as a community, open-sourcing more private work, and going deeper on craft">
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
    .reveal { opacity: 0; animation: fade .7s ease forwards; }
